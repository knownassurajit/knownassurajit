<svg width="900" height="260" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Berkeley Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <defs>
    <clipPath id="rounded">
      <rect x="0" y="0" width="900" height="260" rx="10"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <rect x="0" y="0" width="900" height="260" fill="#0E1420"/>

    <!-- title bar -->
    <rect x="0" y="0" width="900" height="34" fill="#161D2B"/>
    <line x1="0" y1="34" x2="900" y2="34" stroke="#2A3348" stroke-width="1"/>
    <circle cx="20" cy="17" r="5" fill="#3A4358"/>
    <circle cx="38" cy="17" r="5" fill="#3A4358"/>
    <circle cx="56" cy="17" r="5" fill="#3A4358"/>
    <text x="450" y="21" fill="#7C89A6" font-size="12" text-anchor="middle" letter-spacing="0.5">psql — surajit@production</text>

    <!-- prompt + query -->
    <text x="28" y="66" fill="#E0A458" font-size="14">surajit=#</text>
    <text x="112" y="66" fill="#E7EBF5" font-size="14">SELECT name, role, company FROM engineers WHERE id = 'surajit_das';</text>

    <!-- result table -->
    <g>
      <line x1="28" y1="86" x2="872" y2="86" stroke="#2A3348" stroke-width="1"/>
      <text x="40" y="106" fill="#7C89A6" font-size="12" letter-spacing="0.5">name</text>
      <text x="240" y="106" fill="#7C89A6" font-size="12" letter-spacing="0.5">role</text>
      <text x="620" y="106" fill="#7C89A6" font-size="12" letter-spacing="0.5">company</text>
      <line x1="28" y1="118" x2="872" y2="118" stroke="#2A3348" stroke-width="1"/>

      <text x="40" y="146" fill="#E7EBF5" font-size="19" font-weight="600">Surajit Das</text>
      <text x="240" y="146" fill="#E7EBF5" font-size="19" font-weight="600">Asst. Manager, BI</text>
      <text x="620" y="146" fill="#E7EBF5" font-size="19" font-weight="600">Bosch India</text>

      <line x1="28" y1="164" x2="872" y2="164" stroke="#2A3348" stroke-width="1"/>
      <text x="28" y="184" fill="#7C89A6" font-size="12">(1 row)</text>
    </g>

    <!-- footer strap -->
    <text x="28" y="222" fill="#7C89A6" font-size="13">Business Intelligence &amp; Database Engineer<tspan fill="#E0A458">_</tspan></text>
    <text x="28" y="242" fill="#3F4A63" font-size="12">PL/SQL · PostgreSQL · Oracle · ETL · Query &amp; pipeline performance tuning</text>
  </g>
</svg>
