name: Update GitHub Activity

on:
  schedule:
    - cron: "0 */12 * * *"
  push:
    branches:
      - master
  pull_request:
    branches: [develop, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    container:
      image: python:3.12-slim
    steps:
      - name: Install git
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates
          rm -rf /var/lib/apt/lists/*

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'develop' }}

      - name: Validate scripts (py_compile)
        run: |
          python -m py_compile update_github_activity.py download_badges.py design_tokens.py
      - name: Verify no undeclared imports
        run: python -c "import json, os, re, ssl, urllib.request, collections, datetime; print('All stdlib imports OK')"

      - name: Update Activity
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python update_github_activity.py

      - name: Commit changes to develop
        if: github.event_name != 'pull_request'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md assets/stat-overview.svg assets/stat-languages.svg assets/stat-heatmap.svg
          git commit -m "docs: auto-update github activity stats" || echo "No changes to commit"
          git push origin HEAD:develop
          echo "DEVELOP_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Promote develop to master
        if: github.event_name != 'pull_request'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git fetch origin master
          git checkout -B master origin/master
          if git merge --ff-only "$DEVELOP_SHA"; then
            git push origin master
          else
            echo "::error::Fast-forward promotion of develop -> master failed. develop (${DEVELOP_SHA}) and master have diverged; manual intervention required." >&2
            exit 1
          fi
